# SonarCloud (SAST, SEC-81). Analisa o código da API e do web, além de Terraform,
# Kubernetes e Dockerfiles (o Sonar também tem regras de segurança para IaC).
sonar.projectKey=gabste8831_cryptidwatch
sonar.organization=gabste8831
sonar.projectName=CryptidWatch

sonar.sources=app/api/src,app/api/sql,app/web/src,app/web/nginx,app/api/Dockerfile,app/web/Dockerfile,infra/terraform,k8s
sonar.tests=app/api/tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.terraform/**

sonar.javascript.lcov.reportPaths=app/api/coverage/lcov.info
# O frontend não tem testes unitários (validado por lint, build e testes manuais/E2E);
# a cobertura é cobrada só da API, onde estão as regras de segurança.
sonar.coverage.exclusions=app/web/**,infra/**,k8s/**,app/api/src/server.js,app/api/src/scripts/**

sonar.sourceEncoding=UTF-8
