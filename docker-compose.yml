# Ambiente local: dependências da API (Postgres, Redis, MinIO no lugar do S3).
#   docker compose up -d
# As credenciais abaixo são só para desenvolvimento local.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptidwatch
      POSTGRES_PASSWORD: cryptidwatch
      POSTGRES_DB: cryptidwatch
    ports: ["127.0.0.1:5433:5432"] # 5433 no host: a 5432 costuma estar ocupada por um Postgres instalado
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/api/sql/create-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptidwatch"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "redis-local-dev"]
    ports: ["127.0.0.1:6379:6379"]

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
