# Ambiente local completo: Postgres, Redis, SeaweedFS (S3 local), API e web.
#   docker compose up -d postgres redis s3 s3-init   # só as dependências (para npm run dev)
#   docker compose up -d --build                      # tudo, inclusive API e web em containers
# As credenciais abaixo são só para desenvolvimento local.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptidwatch
      POSTGRES_PASSWORD: cryptidwatch
      POSTGRES_DB: cryptidwatch
    ports: ["127.0.0.1:5433:5432"] # 5433 no host: a 5432 costuma estar ocupada por um Postgres instalado
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/api/sql/create-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptidwatch"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "redis-local-dev"]
    ports: ["127.0.0.1:6380:6379"] # 6380 no host: a 6379 pode estar ocupada por um Redis instalado

  # S3 local. (MinIO e LocalStack deixaram de ter imagem pública gratuita.)
  s3:
    image: chrislusf/seaweedfs:latest
    # Com uma identidade configurada, o SeaweedFS valida as assinaturas (URLs pré-assinadas
    # e a política do POST), como o S3 de verdade. Sem ela, nega as requisições assinadas.
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
      - ./app/api/dev/s3.json:/etc/seaweedfs/s3.json:ro

  # Cria o bucket de fotos (o equivalente local do bucket privado do Terraform).
  s3-init:
    image: chrislusf/seaweedfs:latest
    depends_on: [s3]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until echo 's3.bucket.list' | weed shell -master=s3:9333 >/dev/null 2>&1; do sleep 2; done;
      echo 's3.bucket.create -name cryptidwatch-fotos' | weed shell -master=s3:9333 || true"

  api:
    build: ./app/api
    profiles: ["app"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"   # local sem HTTPS; na AWS fica true (padrão)
      TRUST_PROXY: "1"
      JWT_SECRET: segredo-local-do-docker-compose-com-mais-de-32-bytes
      DATABASE_URL: postgres://cryptidwatch:cryptidwatch@postgres:5432/cryptidwatch
      REDIS_HOST: redis
      REDIS_AUTH_TOKEN: redis-local-dev
      S3_BUCKET: cryptidwatch-fotos
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

  web:
    build: ./app/web
    profiles: ["app"]
    environment:
      API_UPSTREAM: http://api:3000
      PHOTO_ORIGIN: http://localhost:8333
    depends_on: [api]
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
  s3data:
