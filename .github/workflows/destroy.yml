# Derruba toda a infraestrutura da AWS (o Learner Lab cobra por hora).
# Manual: Actions → "Destruir infraestrutura" → Run workflow → digite "destruir".

name: Destruir infraestrutura

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite "destruir" para confirmar'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirmacao == 'destruir'
    runs-on: ubuntu-latest
    environment: aws-academy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false
      - working-directory: infra/terraform
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform destroy -input=false -auto-approve
