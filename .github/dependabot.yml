# Atualizações automáticas de dependências (complementa o npm audit e o Trivy da pipeline).
version: 2
updates:
  - package-ecosystem: npm
    directory: /app/api
    schedule: { interval: weekly }
    groups:
      api-deps: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /app/web
    schedule: { interval: weekly }
    groups:
      web-deps: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: docker
    directories: [/app/api, /app/web]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly } # mantém os SHAs fixados atualizados
  - package-ecosystem: terraform
    directories: [/infra/terraform, /infra/terraform/bootstrap]
    schedule: { interval: weekly }
